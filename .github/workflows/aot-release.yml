name: AOT Release Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build, test and AOT-verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ZenStates-Core.csproj

      # Gate 1: the smoke test must pass before anything is published.
      - name: Smoke test
        run: dotnet run --project ZenStates.Core.Tests/ZenStates.Core.Tests.csproj -c ${{ inputs.configuration }}

      # Gate 2: IsAotCompatible turns on the AOT/trim analyzers, so any IL2xxx/IL3050 becomes an error here.
      - name: Build (warnings as errors)
        run: dotnet build ZenStates-Core.csproj -c ${{ inputs.configuration }} --no-restore -p:TreatWarningsAsErrors=true

      # Gate 3: full ILC publish. Any trimmer/ILC warning fails the build, so an AOT-unsafe DLL is never produced.
      - name: Publish (AOT, warnings as errors)
        run: dotnet publish ZenStates-Core.csproj -c ${{ inputs.configuration }} -f net8.0-windows -r win-x64 -p:TreatWarningsAsErrors=true

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ZenStates-Core-${{ inputs.configuration }}
          path: |
            bin/${{ inputs.configuration }}/net8.0-windows/*.dll
            bin/${{ inputs.configuration }}/netstandard2.1/*.dll
            bin/${{ inputs.configuration }}/net8.0-windows/win-x64/publish/*.dll
