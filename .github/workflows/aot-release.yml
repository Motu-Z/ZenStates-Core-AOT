name: AOT Release Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build ZenStates-Core
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ZenStates-Core.csproj

      - name: Build
        run: dotnet build ZenStates-Core.csproj -c ${{ inputs.configuration }} --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ZenStates-Core-${{ inputs.configuration }}
          path: |
            bin/${{ inputs.configuration }}/net8.0-windows/*.dll
            bin/${{ inputs.configuration }}/netstandard2.1/*.dll
