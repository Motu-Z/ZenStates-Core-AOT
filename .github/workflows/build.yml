name: Sync Upstream and Build DLL
on:
  schedule:
    - cron: '0 0 1 * *'  # 每个月1号的 UTC 00:00 自动运行（北京时间每月1号早上8点）
  workflow_dispatch:       # 允许你在 Actions 页面手动点击触发

jobs:
  sync-and-build:
    runs-on: windows-latest
    if: github.event.repository.fork == true
    steps:
      - name: Sync with Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: irusanov/ZenStates-Core
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          force: true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Restore NuGet Packages
        run: nuget restore ZenStates-Core.csproj

      - name: Build Solution
        run: msbuild ZenStates-Core.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenStates-Core-DLL
          path: bin/Release/**/*.dll
